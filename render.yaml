services:
  - type: web
    name: telegram-gorev
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      - key: WEB_HOST
        value: 0.0.0.0
      - key: BOT_DB
        value: /tmp/telegram-data/bot.sqlite3
      - key: DEMO_MODE
        value: "true"
